<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">

<title>ئەپی ئەلەمنیۆم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#484e54;--panel:#535a61;--line:#6f7780;--ink:#e6f0ec;--mute:#8aa59b;--green:#2f8f63;--red:#d4574a;--blue:#3a7fb8;--grid:#50565c}

body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#143d2e;font-weight:800}
header h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;margin:0;flex:1}
button{font-family:inherit;font-size:14px;color:var(--ink);border:0;border-radius:10px;padding:10px 12px;background:#636b73;cursor:pointer}
button:disabled{opacity:.35}
button.pri{background:var(--green);font-weight:600}
button.dan{background:var(--red)}

#app{flex:1;min-height:0;display:flex;flex-direction:column}

.ed .tools,.ed .tb,.ed .pal{direction:rtl}.ed .tools{grid-column:1/3;grid-row:1}.ed #cv{grid-column:2;grid-row:2;min-height:0}.ed .tb{grid-column:2;grid-row:3}
.ed .pal{grid-column:1;grid-row:2/4;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-top:0;border-right:1px solid var(--line);padding:5px 4px;gap:4px}
.ed .pal button{min-width:0;width:100%;padding:4px 2px;font-size:10px;background:#5d8c72;color:#fff;font-weight:600}.ed .pal .sep{width:100%;height:1px;min-height:1px}.ed .pal svg{width:44px;height:34px}
main{flex:1;overflow:auto;padding:14px}
.row{display:flex;align-items:center;gap:8px}

.card .t{flex:1;cursor:pointer;min-width:0}
.card .t b{display:block;font-size:16px}
.card .t span{color:var(--mute);font-size:12px}
.card button{padding:8px 10px}
.card .th{width:70px;height:70px;flex:none;background:#3b4045;border-radius:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 14px;text-align:center;color:var(--mute)}
.rate{display:flex;gap:8px;margin-top:6px}
.rate div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mute);cursor:pointer}
.rate b{display:block;color:var(--ink);font-size:15px}
#cv{flex:1;min-height:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;touch-action:none;display:flex}

.tools .sp{flex:1}#ed{font-size:10px;padding:3px 6px}
.tools #dm{display:flex;align-items:center;gap:4px}.tools #dm svg{width:26px;height:20px}
.tools button:not(.dan){background:var(--green);color:#fff}
.tools button{white-space:nowrap;padding:5px 8px;font-size:12px;border-radius:8px;line-height:1.2}
.pal{display:flex;gap:5px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.pal button{flex:none;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;font-size:10.5px;border-radius:8px;line-height:1.2}

.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dlg h2{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:11px;line-height:1.35;color:var(--mute);margin:7px 0 3px}
.dlg input[type=text],.dlg input[type=number]{width:100%;padding:5px 6px;border-radius:7px;border:1px solid var(--line);background:#484e54;color:var(--ink);font:inherit;font-size:14px;text-align:center}
.dlg .two{display:flex;gap:8px;align-items:flex-end}
.dlg .act{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:-16px;background:var(--panel);padding:10px 0 2px}
.dlg .act button{flex:1}
.chips{display:flex;gap:8px}
.chips label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--ink);font-size:14px;cursor:pointer}
.chips input{display:none}
.chips label:has(input:checked){background:var(--green);border-color:var(--green)}
#rp{position:fixed;inset:0;z-index:8;background:#4d5258;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#rp .bar{display:flex;gap:8px;padding:10px 12px;background:#143d2e;align-items:center}
#rp .bar b{flex:1}
#rp .body{flex:1;overflow:auto;padding:14px;color:#1b2326}
.pg{background:#fff;border-radius:4px;padding:16px;margin:0 auto 14px;max-width:720px;direction:rtl}
.pg h3{margin:14px 0 6px;font-size:15px;display:flex;justify-content:space-between}
.pg h3 small{font-weight:400;color:#555}
.pg table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.pg th{background:#d3dbe8;padding:6px;border:1px solid #bcc6d4}
.pg td{padding:5px;border:1px solid #d5dbe3}
.pg th.y{background:#fff3cf}
.pg .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg .grid svg{width:100%;height:auto;max-height:340px;direction:ltr}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block}.tb{display:flex;gap:8px;padding:7px 12px;background:#42474c;border-top:1px solid var(--line);font-size:13px;justify-content:space-around;flex-wrap:wrap}.tb b{color:#7fe0b0}.sum{margin-top:12px}.sum td{padding:8px 6px}.sum td:first-child{text-align:right}.sum td:last-child{font-weight:700}.sum .gt td{background:#e3f1e8;font-weight:800;font-size:15px}.pg .tot{text-align:center;font-weight:700;margin:6px 0}
@media print{header,#app{display:none}#rp{position:static;background:#fff}#rp .bar{display:none}}
.gt{font-size:12px;color:var(--mute);margin:10px 0 4px}.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dlg .kc{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;cursor:pointer;color:var(--ink);font-size:12px}.kc .pv{background:#fff;border-radius:6px;height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}.kc .pv svg{height:100%;width:100%;direction:ltr}.kc input{display:none}.kc:has(input:checked){border-color:var(--green);background:#1b3b2e}
:focus-visible{outline:2px solid #7fe0b0;outline-offset:2px}
</style>
</head>

<script>
/* ===== pure logic ===== */
var T=4.2,ZT=6,MIN=15,STD={L:4,T:4.5,Z:4.5};

var OPEN={door:1,window:1,vent:1,slide:1,slide2:1,mesh:1};
function zv(t){return (t==='door'||t==='slide'||t==='slide2'||t==='mesh')?ZT*1.5-.5:ZT-.5}
function leaf(t){return{t:t||'fixed',f:0}}
function r1(n){return Math.round(n*10)/10}
function setT(q){T=(q.kind==='door'||q.kind==='window')?4.15:4.2}
function lo(q){setT(q);var o={rect:{},div:[],leaves:[]};(function go(n,x,y,w,h,p){o.rect[p]={x:x,y:y,w:w,h:h,n:n};if(!n.c){o.leaves.push(p);return}var off=0,v=n.d==='v';n.s.forEach(function(sz,i){go(n.c[i],v?x+off:x,v?y:y+off,v?sz:w,v?h:sz,p+'.'+i);off+=sz;if(i<n.c.length-1)o.div.push({p:p,i:i,d:n.d,pos:(v?x:y)+off,x:x,y:y,w:w,h:h})})})(q.root,0,0,q.w,q.h,'r');return o}
function gr(q,r){setT(q);var e=.01,x1=r.x<=e?T:r.x+T/2,x2=r.x+r.w>=q.w-e?q.w-T:r.x+r.w-T/2,y1=r.y<=e?T:r.y+T/2,y2=r.y+r.h>=q.h-e?(q.nb?q.h:q.h-T):r.y+r.h-T/2;return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function getN(q,p){var n=q.root;p.split('.').slice(1).forEach(function(i){n=n.c[+i]});return n}
function setN(q,p,nn){var a=p.split('.');if(a.length===1){q.root=nn;return}getN(q,a.slice(0,-1).join('.')).c[+a[a.length-1]]=nn}
function even(total,n){var a=[],s=0;for(var i=0;i<n;i++){var v=i<n-1?r1(total/n):r1(total-s);a.push(v);s+=v}return a}
function splitCell(q,p,d,cnt){
  var r=lo(q).rect[p],n=r.n;if(n.c)return false;
  var ext=d==='v'?r.w:r.h;if(ext/(cnt+1)<MIN)return false;
  var a=p.split('.'),par=a.length>1?getN(q,a.slice(0,-1).join('.')):null,parts=even(ext,cnt+1);

    Array.prototype.splice.apply(par.s,[i,1].concat(parts));Array.prototype.splice.apply(par.c,[i,1].concat(ks));return true}

function mk(parts,n){var b=parts.indexOf(Math.max.apply(null,parts));return parts.map(function(_,j){return j===b?n:leaf('fixed')})}
function delDiv(q,p,i){var n=getN(q,p),a=n.c[i],m=leaf(a.c?'fixed':a.t);m.f=a.f||0;var sz=r1(n.s[i]+n.s[i+1]);n.s.splice(i,2,sz);n.c.splice(i,2,m);if(n.c.length===1)setN(q,p,n.c[0])}
function ded(q,r,i){setT(q);var n=r.n,v=n.d==='v',st=v?r.x:r.y,en=st+(v?r.w:r.h),tot=v?q.w:q.h,f0=st<=.01?T:T/2,f1=en>=tot-.01?((!v&&q.nb)?0:T):T/2;return (i===0?f0:T/2)+(i===n.s.length-1?f1:T/2)}
function setDim(q,p,i,v){var n=getN(q,p),j=i<n.s.length-1?i+1:i-1,d=v-n.s[i];if(v<MIN||n.s[j]-d<MIN)return false;n.s[i]=r1(v);n.s[j]=r1(n.s[j]-d);return true}
function scaleN(n,sx,sy){if(!n.c)return;var f=n.d==='v'?sx:sy;n.s=n.s.map(function(v){return r1(v*f)});n.c.forEach(function(c){scaleN(c,sx,sy)})}
function fixN(n,w,h){if(!n.c)return;var v=n.d==='v',ext=v?w:h,s=n.s.reduce(function(a,b){return a+b},0);n.s[n.s.length-1]=r1(n.s[n.s.length-1]+ext-s);n.c.forEach(function(c,i){fixN(c,v?n.s[i]:w,v?h:n.s[i])})}
function resize(q,w,h){var sx=w/q.w,sy=h/q.h;scaleN(q.root,sx,sy);q.w=w;q.h=h;fixN(q.root,w,h)}
function newPlan(name,kind,w,h,qty){var st=kind==='slide3'?3:kind==='slide2t'?2:0;if(st)kind='slide';return{id:Math.random().toString(36).slice(2,9),name:name,kind:kind,st:st,w:w,h:h,qty:qty,root:leaf('fixed')}}
function gSide(q,rr,n){return (n.gs&&n.gs[0])||((rr.x+rr.w/2<q.w/2)?'r':'l')}
function zDim(q,n,g){if(q.kind==='slide'&&q.st===3&&(n.t==='slide'||n.t==='slide2'||n.t==='mesh'))return[q.w/2,q.h-7];return[g.w+1,g.h+1]}
function makeSlide(q,p,st){var r=lo(q).rect[p];if(!r||r.n.c)return false;var a=leaf('slide'),b=leaf('slide');a.f=1;a.g=r.n.g;b.g=r.n.g;setN(q,p,{d:'v',s:even(r.w,2),c:[a,b]});q.st=st;return true}
function defAcc(){var r=[],i=0;function a(n,k,c){r.push({id:'a'+(i++),name:n,kind:k,n:c,price:0})}
  a('گۆشەپێچی L ی دەرگا','door',4);a('گۆشەپێچی Z ی دەرگا','door',4);a('دەستگیر','door',1);a('لولا','door',3);a('قفڵی مۆرتای سلندەر','door',1);
  a('گۆشەپێچی L ی پەنجەرە','window',4);a('گۆشەپێچی Z ی پەنجەرە','window',4);a('دەستگیر','window',1);a('لولا','window',3);
  a('گۆشەپێچی L ی سلاید','slide',4);a('گۆشەپێچی Z ی سلاید','slide',4);a('غەڵتەی سلاید','slide',2);return r}
function calc(P){
  var curK='door',R={hk:{},hd:0,tg:{s:0,k:0},tk:{},pk:{},lk:{},ck:{},len:{L:0,T:0,Z:0,C:0,S:0,P:0},cuts:{},glass:{},acc:{},area:0,garea:0};
  function cut(pf,len,ang,n){len=r1(len);var k=pf+'|'+len+'|'+ang;R.lk[curK]=R.lk[curK]||{L:0,T:0,Z:0,C:0,S:0,P:0};R.lk[curK][pf]+=len*n;R.ck[curK]=R.ck[curK]||{};R.ck[curK][k]=(R.ck[curK][k]||0)+n;R.cuts[k]=(R.cuts[k]||0)+n;R.len[pf]+=len*n}
  function ac(nm,n){if(n)R.acc[nm]=(R.acc[nm]||0)+n}
  P.plans.forEach(function(q){
    var N=q.qty,L=lo(q),e=.01;curK=q.kind;R.pk[q.kind]=(R.pk[q.kind]||0)+N;R.area+=q.w*q.h/1e4*N;
    if(q.nb){cut('L',q.w,45,N);cut('L',q.h,45,2*N);ac('گۆشەپێچی L ی چوارچێوە',2*N)}else{cut('L',q.w,45,2*N);cut('L',q.h,45,2*N);ac('گۆشەپێچی L ی چوارچێوە',4*N)}
    L.div.forEach(function(d){var nn=L.rect[d.p].n,ka=nn.c[d.i],kb=nn.c[d.i+1],sl=function(t){return t==='slide'||t==='slide2'||t==='mesh'};if(q.kind==='slide'&&d.d==='v')return;var v=d.d==='v',a=v?(d.y<=e?T:T/2):(d.x<=e?T:T/2),b=v?(d.y+d.h>=q.h-e?(q.nb?0:T):T/2):(d.x+d.w>=q.w-e?T:T/2);cut('T',(v?d.h:d.w)-a-b,90,N)});
    L.leaves.forEach(function(p){var r=L.rect[p],n=r.n,g=gr(q,r),o=OPEN[n.t];
      if(n.hd==='c80'||n.hd==='s80')R.hk[n.hd]=(R.hk[n.hd]||0)+N;if(n.hd==='lock'||n.hd==='span')R.hd+=N;if(n.t==='fan')ac('پانکەی هەوا',N);if(n.t==='louver')ac('لامێری',N);
      if(n.t==='louver'||n.t==='fan'||n.t==='blank')return;
      var zd=zDim(q,n,g),gw=(o?zd[0]-2*ZT:g.w)-2,gh=(o?zd[1]-2*ZT:g.h)-2,k=r1(gw)+'|'+r1(gh);
      if(o){if(n.t!=='vent'&&n.t!=='mesh'&&!n.hd)R.hd+=N;cut('Z',zd[0],45,2*N);cut('Z',zd[1],45,2*N);var ncs=(r.x>.01?1:0)+(r.x+r.w<q.w-.01?1:0);if(ncs===0)ncs=2;if(n.cap&&ncs)cut('C',zd[1],90,ncs*N);ac('گۆشەپێچی Z ی کراوە',4*N);

        ac('لولا',({door:3,window:3,vent:2,slide:0})[n.t]*N);

        if(n.t==='slide')ac('غەڵتەی سلاید',2*N)}
      R.tk[q.kind]=(R.tk[q.kind]||0)+2*(gw+gh)*N;if(n.g==='s'){cut('P',q.w/2-2,45,2*N);cut('P',q.h-4,45,2*N)}if(n.g==='k'){cut('S',zd[0],45,2*N);cut('S',zd[1],45,2*N)}if(n.t!=='mesh'){R.glass[k]=R.glass[k]||{w:r1(gw),h:r1(gh),n:0};R.glass[k].n+=N;R.garea+=gw*gh/1e4*N}});
  });
  return R}
/* ===== app ===== */
var db={projects:[],usd:158850,ali:3185};
try{var _s=localStorage.getItem('alu2');if(_s)db=JSON.parse(_s)}catch(e){}
db.set=db.set||{};db.set.alm=+db.set.alm||0;db.set.als=+db.set.als||0;db.set.ap=+db.set.ap||0;db.set.tm=+db.set.tm||0;db.set.hl=+db.set.hl||0;db.set.hs=+db.set.hs||0;db.set.hc=+db.set.hc||0;db.set.hr=+db.set.hr||0;db.set.tmn=+db.set.tmn||0;db.set.ts=+db.set.ts||0;db.set.tsn=+db.set.tsn||0;db.set.an=+db.set.an||0;

function nrm(v){return String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٫,،]/g,'.')}

function prevSvg(key){var q;if(key==='door'||key==='window'){q=newPlan('',key,key==='door'?70:110,key==='door'?170:100,1);q.root.t=key}else{q=newPlan('',key,130,110,1);makeSlide(q,'r',key==='slide3'?3:2)}return rp(q,{dims:false,light:1,id:'pv'+key})}
function modal(title,fields,okText,ok){
  var o=document.createElement('div');o.className='ov';
  var h='<div class="dlg" role="dialog"><h2>'+title+'</h2>';
